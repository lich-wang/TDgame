<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>霍尔木兹狂想曲 🛢️</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game-container">

  <!-- 开始画面 -->
  <div id="start-screen">
    <div class="start-panel">
      <div class="start-kicker">黄金水道战情室</div>
      <h1>霍尔木兹狂想曲</h1>
      <div class="subtitle">舰队压境，黑金仍要出港</div>
      <div class="start-metrics" aria-hidden="true">
        <span>20 波攻势</span>
        <span>6 类防御</span>
        <span>油轮护航</span>
      </div>
      <button id="btn-start" onclick="game.start()">进入战区</button>
    </div>
  </div>

  <!-- Top Bar -->
  <div id="top-bar">
    <span class="stat stat-wave"><span class="label">波次</span><span class="val" id="wave-info">0/20</span></span>
    <span class="stat"><span class="label">绿纸</span><span class="val" id="money-display">350</span></span>
    <span class="stat"><span class="label">油轮</span><span class="val" id="oil-ship-count">0/0</span></span>
    <span class="stat"><span class="label">声望</span><span class="val" id="rep-display">50</span></span>
  </div>

  <!-- 鹰酱播报 -->
  <div id="ops-strip">
    <div class="ops-item"><span class="ops-label">态势</span><span id="condition-display">战备</span></div>
    <div id="wave-meter"><span id="wave-progress"></span></div>
    <div class="ops-item"><span class="ops-label">选中</span><span id="selected-display">待命</span></div>
  </div>
  <div id="news-ticker"><span id="news-text">鹰酱舰队正在靠近黄金水道...</span></div>

  <!-- Canvas -->
  <canvas id="game-canvas" width="960" height="480"></canvas>

  <!-- Bottom Panel -->
  <div id="bottom-panel">
    <!-- 塔按钮由 JS 动态生成 -->
    <span class="divider"></span>
    <span class="action-group-label">主动出击</span>
    <button class="action-btn" id="btn-strike1" onclick="game.doStrike('motorbike')"
      title="🛵 小摩托快递 — 无人机袭扰鹰酱基地 | 50%概率获得30~80绿纸 | 延迟下波10秒 | 费用:¥50"
      onmouseenter="document.getElementById('news-text').textContent='📋 🛵 小摩托快递：无人机袭扰鹰酱基地，概率获绿纸+延迟下一波'"
      onmouseleave="document.getElementById('news-text').textContent=document.getElementById('news-text').dataset.prev||''">
      <span class="icon">🛵</span><span class="name">小摩托快递</span>
      <span style="font-size:9px;color:#ffaaaa">¥50</span>
    </button>
    <button class="action-btn" id="btn-strike2" onclick="game.doStrike('firecracker')"
      title="🧨 二踢脚警告 — 弹道导弹袭击鹰酱基地 | 必定获得60~150绿纸 | 延迟下波25秒 | 费用:¥100"
      onmouseenter="document.getElementById('news-text').textContent='📋 🧨 二踢脚警告：弹道导弹袭击，必定获绿纸+大幅延迟下一波'"
      onmouseleave="document.getElementById('news-text').textContent=document.getElementById('news-text').dataset.prev||''">
      <span class="icon">🧨</span><span class="name">二踢脚警告</span>
      <span style="font-size:9px;color:#ffaaaa">¥100</span>
    </button>
    <button class="action-btn" id="btn-strike3" onclick="game.doStrike('secret')"
      title="☢️ 波斯秘宝威慑 — 宣称核突破 | 消耗20声望跳过当前波次 | 触发制裁debuff"
      onmouseenter="document.getElementById('news-text').textContent='📋 ☢️ 波斯秘宝威慑：消耗20声望，跳过一波但触发制裁'"
      onmouseleave="document.getElementById('news-text').textContent=document.getElementById('news-text').dataset.prev||''">
      <span class="icon">☢️</span><span class="name">波斯秘宝威慑</span>
    </button>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- 事件弹窗 -->
  <div id="event-popup">
    <div class="event-icon" id="event-icon"></div>
    <div class="event-title" id="event-title"></div>
    <div class="event-desc" id="event-desc"></div>
  </div>

  <!-- 通用弹窗 -->
  <div id="modal-overlay">
    <div id="modal">
      <h2 id="modal-title"></h2>
      <p id="modal-body"></p>
      <button id="modal-btn" onclick="game.closeModal()">确定</button>
    </div>
  </div>

</div>

<!-- JS 按依赖顺序加载 -->
<script src="js/data.js"></script>
<script src="js/economy.js"></script>
<script src="js/projectile.js"></script>
<script src="js/enemy.js"></script>
<script src="js/tower.js"></script>
<script src="js/map.js"></script>
<script src="js/events.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>

</body>
</html>
